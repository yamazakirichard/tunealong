[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tunealong"
version = "0.1.0"
description = "Self-hosted play-along library with per-song pitch/tempo presets"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "bcrypt>=4.1",
  "python-multipart>=0.0.20",  # tab file uploads
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["tunealong*"]

[tool.setuptools.package-data]
tunealong = ["*.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
